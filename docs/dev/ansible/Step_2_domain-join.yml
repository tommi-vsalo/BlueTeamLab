- name: Client Domain Configuration
  hosts: cl01
  gather_facts: false

  vars:
    domain_name: blueteamlab.local
    dc_dns_ip: "10.10.10.20"
    client_dns_adapter: "Ethernet 2"
    domain_join_user: "BLUETEAMLAB\\Administrator"
    domain_join_password: "Blue123!"

  tasks:
    - name: Ensure WinRM service is set to automatic
      ansible.windows.win_service:
        name: WinRM
        start_mode: auto
        state: started

    - name: Configure WinRM basic auth and unencrypted traffic
      ansible.windows.win_shell: |
        Set-Item WSMan:\localhost\Service\Auth\Basic -Value $true
        Set-Item WSMan:\localhost\Service\AllowUnencrypted -Value $true
      changed_when: false

    - name: Open WinRM port 5985 in firewall permanently
      ansible.windows.win_shell: |
        $existing = Get-NetFirewallRule -Name "WinRM-HTTP-Ansible" -ErrorAction SilentlyContinue
        if (-not $existing) {
          New-NetFirewallRule -Name "WinRM-HTTP-Ansible" -DisplayName "WinRM HTTP Ansible" -Protocol TCP -LocalPort 5985 -Action Allow -Direction Inbound -Profile Domain,Private,Public -Enabled True
        }
      changed_when: false

    - name: Register startup scheduled task to persist network profile and WinRM after reboots
      ansible.windows.win_shell: |
        $script = 'Start-Sleep -Seconds 60; whoami | Out-File C:\Windows\Temp\winrm-log.txt; Get-NetAdapter | ForEach-Object { try { Set-NetConnectionProfile -InterfaceIndex $_.ifIndex -NetworkCategory Private -ErrorAction Stop } catch { $_ | Out-File -Append C:\Windows\Temp\winrm-log.txt } }; Set-Item WSMan:\localhost\Service\Auth\Basic -Value $true; Set-Item WSMan:\localhost\Service\AllowUnencrypted -Value $true'
        $script | Out-File -Encoding ASCII C:\Windows\Temp\winrm-persist.ps1
        $action = New-ScheduledTaskAction -Execute "powershell.exe" -Argument "-ExecutionPolicy Bypass -File C:\Windows\Temp\winrm-persist.ps1"
        $trigger = New-ScheduledTaskTrigger -AtStartup
        Register-ScheduledTask -TaskName "WinRM-Persist" -Action $action -Trigger $trigger -RunLevel Highest -User "Administrator" -Password "blue" -Force
      changed_when: false

    - name: Set hostname to cl01
      ansible.windows.win_hostname:
        name: cl01
      register: hostname_result

    - name: Reboot if hostname changed
      ansible.windows.win_reboot:
      when: hostname_result is changed

    - name: Set DNS to DC
      ansible.windows.win_dns_client:
        adapter_names:
          - "{{ client_dns_adapter }}"
        ipv4_addresses:
          - "{{ dc_dns_ip }}"

    - name: Verify DC can be discovered
      ansible.windows.win_shell: |
        nltest /dsgetdc:{{ domain_name }}
      register: dc_check
      changed_when: false

    - name: Show DC discovery output
      ansible.builtin.debug:
        var: dc_check.stdout

    - name: Join domain
      microsoft.ad.membership:
        dns_domain_name: "{{ domain_name }}"
        domain_admin_user: "{{ domain_join_user }}"
        domain_admin_password: "{{ domain_join_password }}"
        state: domain
      register: domain_join

    - name: Reboot after domain join
      ansible.windows.win_reboot:
      when: domain_join.reboot_required | default(true)

    - name: Wait for cl01 to come back after domain join
      ansible.builtin.wait_for_connection:
        delay: 60
        timeout: 300

